services:
  tao:
    image: ghcr.io/soulknight666/telegram-account-orchestrator:${TAO_VERSION:-latest}
    container_name: tao
    restart: unless-stopped
    env_file:
      - ./config/tao.env
    environment:
      TAM_ENV_FILE: /config/tao.env
      TAM_DATA_DIR: /data
      TAM_DEPLOY: server
      TAM_HOST: 0.0.0.0
      TAM_PORT: 8848
    ports:
      - "8848:8848"
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8848/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
